<body>
    <div id="item">
        <img src="./언해피.jpg" alt="민들레">
        <button class="over" id="open" onclick="showDetail()">상세 설명 보기</button>
        <div id="desc" class="detail">
            <h4>언해피</h4>
            <p>엠블럼 키스의 제왕: 이적하는 팀마다 "어릴 적부터 꿈의 팀"이라며 충성을 맹세하지만 1~2년 만에 마음이 바뀝니다.

언해피 제조기: 불만이 생길 때마다 폭탄 인터뷰를 터뜨려 라커룸 분위기를 살얼음판으로 만듭니다.

예술적인 퍼스트 터치와 본헤드 플레이: 공을 3미터 이상 튀기거나, 결정적인 순간 동료의 골을 몸으로 막아내는 엄청난 수비력을 보여줍니다.</p>
            <button id="close" onclick="hideDetail()">상세 설명 닫기</button>
        </div>
    </div>
    <script src="9rd.js"> </script>
